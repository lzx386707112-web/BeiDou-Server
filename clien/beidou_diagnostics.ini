[diagnostics]
; =========================================================================
; Read by TWO modules. Key names are NOT shared between them.
;
;   WzFileLogger.dll            -> health_interval_ms, hang_threshold_ms,
;                                  high_cpu_threshold, high_cpu_threshold_ms,
;                                  dump_on_hang, manual_dump_hotkey,
;                                  log_first_chance_exceptions,
;                                  log_successful_mappings
;   BeiDouVellumVideoCompat.dll -> dump_first_chance_cpp_after   (only this one)
;
; File path is fixed to "<dir of BeiDou.exe>\beidou_diagnostics.ini".
; Dumps are written to "<same dir>\diagnostics\".
;
; NOT configurable here (compiled into the DLLs as immediates):
;   av_limit=32  cpp_limit=32  av_stack_samples=4  cpp_stack_samples=8
;   stack_dwords=32/96  (WzFileLogger)   summarize_limit=64  stack_dwords=96
;   (BeiDouVellumVideoCompat)
; =========================================================================

; Health samples are lightweight and written once per interval.
health_interval_ms=1000
; Create one hang dump after the game window is unresponsive this long.
hang_threshold_ms=5000
; Percentage of one CPU core, so 100 means one fully occupied core.
high_cpu_threshold=70
high_cpu_threshold_ms=3000
dump_on_hang=1
; Hold Ctrl+F12 during a black screen to capture a dump before force-closing.
manual_dump_hotkey=1
; Capture AV plus post-window C++/COM exceptions with module/offset/registers.
log_first_chance_exceptions=1

; Successful file mappings are frequent during preload. Failures are always logged.
; 2026-09-29 phone debugging: 0 -> 1.
;   The phone session logged MapViewOfFile result=00000000 err=8
;   (ERROR_NOT_ENOUGH_MEMORY) three times, right after fopen on List.wz.
;   The PC session with the same build logged zero failures. List.wz is only
;   13336 bytes, so we need the full success/failure record to tell a
;   "single view allocation failure" apart from "global address space problem".
;   Set this back to 0 after the run: it is noisy during preload.
log_successful_mappings=1

; BeiDouVellumVideoCompat.dll: log one summary line per first-chance C++ exception (0xE06D7363),
; including the real _com_error HRESULT, and store a full dump when the Nth one arrives.
; 0 disables the observer entirely; 1 stores the dump at the very first C++ exception.
; 2026-09-29 phone debugging: 1 -> 5.
;   The dump for occurrence 1 (site BeiDou.exe+0x5296C9) is already captured.
;   Occurrences 2 and 3 are the same shape (other instances inside function
;   0x52423E), occurrence 4 is +0x639B81, and occurrence 5 is the only INLINE
;   throw site (BeiDou.exe+0x5F6103 calling 0x00A605C3 directly, bypassing
;   0x40263B) - its context was never dumped and its frame shape differs from
;   the other four.
;   WARNING: the dump fires only when occurrence reaches this value AND no dump
;   has been taken yet (once per process). If this run produces fewer than 5
;   exceptions (check the max occurrence= in VellumVideoCompat.log), no dump is
;   written - in that case set this back to 1 and re-run.
dump_first_chance_cpp_after=5
