[diagnostics]
; Health samples are lightweight and written once per interval.
health_interval_ms=1000
; Create one hang dump after the game window is unresponsive this long.
hang_threshold_ms=5000
; Percentage of one CPU core, so 100 means one fully occupied core.
high_cpu_threshold=70
high_cpu_threshold_ms=3000
dump_on_hang=1
; Hold Ctrl+F12 during a black screen to capture a dump before force-closing.
manual_dump_hotkey=1
; Capture AV plus post-window C++/COM exceptions with module/offset/registers.
log_first_chance_exceptions=1
; Successful file mappings are frequent during preload. Failures are always logged.
log_successful_mappings=0
; BeiDouVellumVideoCompat.dll: log one summary line per first-chance C++ exception (0xE06D7363),
; including the real _com_error HRESULT, and store a full dump when the Nth one arrives.
; 0 disables the observer entirely; 1 stores the dump at the very first C++ exception.
dump_first_chance_cpp_after=1
