<head>

<title>任务 ID 查询</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--mut:#9aa4b2;--acc:#4ea1ff;--chip:#1e2430;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);padding:18px;}
  h1{font-size:18px;margin:0 0 4px}
  .hint{color:var(--mut);font-size:12px;margin:0 0 14px;line-height:1.7}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  #search{flex:1;min-width:220px}
  #count{color:var(--mut);font-size:13px;align-self:center}
  .tablewrap{max-height:75vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
  tr:hover{background:var(--panel)}
  .id{font-family:ui-monospace,monospace;color:var(--acc);cursor:pointer;font-weight:600}
  .chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--mut)}
  .empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<h1>任务 ID 查询</h1>
<p class="hint">数据源：<code>wz-zh-CN/Quest.wz/QuestInfo.img.xml</code>（共 3162 个任务）。
地区依据 <b>area</b> 字段已映射到真实地区名。
等级依据 <b>任务 ID 区间近似</b> 划分（原始数据无等级字段）。
点击任意 ID 可复制。<br>
注：自定义进化任务 600003–600007 不在该表中（无正式定义）。</p>
<div class="bar">
  <input id="search" placeholder="搜索任务名或 ID…">
  <select id="areaSel"><option value="">全部地区</option></select>
  <select id="lvSel">
    <option value="">全部等级</option>
    <option value="newbie">新手 (ID&lt;2000)</option>
    <option value="primary">初级 (2000–9999)</option>
    <option value="mid">中级 (10000–29999)</option>
    <option value="midhigh">中高级 (30000–99999)</option>
    <option value="high">高级/特殊 (≥100000)</option>
  </select>
  <span id="count"></span>
</div>
<div class="tablewrap">
<table>
  <thead><tr><th>ID</th><th>任务名</th><th>地区</th><th>等级段</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>

const LV = {newbie:'新手',primary:'初级',mid:'中级',midhigh:'中高级',high:'高级/特殊'};
const areaSet = {};
QUESTS.forEach(q=>{ if(q.area) areaSet[q.area]=q.an; });
const areaSel=document.getElementById('areaSel');
Object.keys(areaSet).sort((a,b)=>(+a)-(+b)).forEach(a=>{
  const o=document.createElement('option');o.value=a;o.textContent=areaSet[a];areaSel.appendChild(o);
});
const tbody=document.getElementById('tbody');
const search=document.getElementById('search');
const lvSel=document.getElementById('lvSel');
const count=document.getElementById('count');
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const kw=search.value.trim().toLowerCase();
  const av=areaSel.value, lv=lvSel.value;
  const list=QUESTS.filter(q=>{
    if(av && q.area!==av) return false;
    if(lv && q.lv!==lv) return false;
    if(kw){ const hay=(q.id+'|'+q.name).toLowerCase(); if(!hay.includes(kw)) return false; }
    return true;
  });
  count.textContent='显示 '+list.length+' / 共 '+QUESTS.length;
  if(!list.length){ tbody.innerHTML='<tr><td colspan=4 class=empty>无匹配结果</td></tr>'; return; }
  tbody.innerHTML=list.map(q=>
    '<tr><td class=id title="点击复制" data-id="'+q.id+'">'+q.id+'</td>'+
    '<td>'+escapeHtml(q.name)+'</td>'+
    '<td><span class=chip>'+(q.an||'未知')+'</span></td>'+
    '<td>'+LV[q.lv]+'</td></tr>'
  ).join('');
}
tbody.addEventListener('click',e=>{
  if(e.target.classList.contains('id')){
    const id=e.target.dataset.id;
    navigator.clipboard.writeText(id).then(()=>{
      const t=e.target.textContent; e.target.textContent='✓';
      setTimeout(()=>e.target.textContent=t,800);
    });
  }
});
search.addEventListener('input',render);
areaSel.addEventListener('change',render);
lvSel.addEventListener('change',render);
render();
</script>
